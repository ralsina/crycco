name: crycco
version: 0.6.0

authors:
  - Roberto Alsina <roberto.alsina@gmail.com>

targets:
  crycco:
    main: src/main.cr

dependencies:
  baked_file_system:
    github: ralsina/baked_file_system
  ctags:
    path: ctags
  crinja:
    github: straight-shoota/crinja
  docopt-config:
    github: ralsina/docopt-config
  enum_state_machine:
    github: nogginly/enum_state_machine.cr
  markd:
    github: icyleaf/markd
    version: ~> 0.5.0
  sixteen:
    github: ralsina/sixteen
  tartrazine:
    github: ralsina/tartrazine
    version: ~> 0.21.1

development_dependencies:
  ameba:
    git: https://github.com/crystal-ameba/ameba.git
    # The latest release (1.6.4) does not build with Crystal >= 1.21,
    # so track master until the next release.
    branch: master

crystal: ">= 1.13.0"

license: MIT
